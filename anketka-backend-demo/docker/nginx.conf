server {
    listen 80;
    server_name localhost;
    root /var/www/html;            # корень проекта, как на проде (public подставляется ниже)
    index index.php;

    # Логирование
    access_log /dev/stdout;
    error_log /dev/stderr;

    # CORS решается на уровне nginx, а не в PHP. Не '*': с credentials: 'include'
    # браузер отвергает ответ со звёздочкой, нужен точный Origin
    add_header 'Access-Control-Allow-Origin' $http_origin always;
    add_header 'Vary' 'Origin' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin, X-Requested-With, X-API-Key' always;
    add_header 'Access-Control-Max-Age' '86400' always;

    # Handle preflight OPTIONS requests
    if ($request_method = 'OPTIONS') {
        return 200;
    }

    # всё, что не файл, отправляем в public/index.php (как на проде)
    location / {
        try_files /public$uri /public/index.php?$query_string;
    }

    # не отдаём скрытые файлы
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # глушим любые .php кроме фронт-контроллера
    location ~ \.php$ {
        return 404;
    }

    # исполняем ТОЛЬКО фронт-контроллер
    location = /public/index.php {
        fastcgi_pass php-fpm:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    }

    # статика из public (ссылки вида /public/... тоже работают, как на проде)
    location ^~ /public/ {
        try_files $uri =404;
    }
}
