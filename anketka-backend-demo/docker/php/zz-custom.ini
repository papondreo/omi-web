; таймзона и базовые лимиты
date.timezone = UTC
memory_limit = 256M
max_execution_time = 30
post_max_size = 32M
upload_max_filesize = 32M
expose_php = Off

; сессии PHP не используются (API stateless, авторизация по заголовку)
session.upload_progress.enabled = Off

; ошибки — только в лог (stderr php-fpm → docker compose logs php-fpm), не в HTTP-ответ.
; В образе php:8.3-fpm нет php.ini, а встроенное умолчание PHP — display_errors=On:
; любой фатал отдавал клиенту пути к файлам и стектрейс.
display_errors = Off
display_startup_errors = Off
log_errors = On

; opcache
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=100000
opcache.validate_timestamps=1
opcache.revalidate_freq=2
opcache.jit=1255
opcache.jit_buffer_size=64M

default_socket_timeout = 10
