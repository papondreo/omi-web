# В бою: сборка Docker-образа → push в ghcr.io → по SSH на сервере docker compose pull && up -d
# (ветка dev → тестовый сервер, main → прод). В демо — проверки и сборка образа без публикации.
name: CI

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # next build сам проверяет типы, отдельный tsc здесь не нужен
      - name: Build
        run: npm run build

  docker:
    needs: check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          build-args: |
            BUILD_ENV=production
